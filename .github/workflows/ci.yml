# Runs on every push to main/staging and on any PR into them. Deliberately does
# NOT run the Playwright e2e suite — that needs a browser binary and a live
# uvicorn subprocess, which roughly triples the run time. Run those locally with
# `pytest -m e2e` before a release; everything else gates here.
name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v6

      - name: Install
        # From uv.lock — the same pinned versions production runs (requirements.lock
        # is exported from it). An unpinned `pip install` pulled FastAPI 0.165 and
        # had CI red from Sep 2026 on a version production never ran.
        run: |
          uv sync --frozen --extra dev --extra api
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Lint
        # Blocking since 2026-11-14: the backlog was cleared to zero (E402 is
        # ignored for pytest-bdd step files in pyproject.toml), so any finding
        # here is new.
        run: ruff check .

      - name: Test
        # Tests use a throwaway SQLite DB — no DATABASE_URL is set here on
        # purpose, so a stray connection string can never point CI at Neon.
        run: pytest -m "not e2e" -q
